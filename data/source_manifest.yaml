sources:
  - source_id: ds004752
    kind: dataset
    title: Zurich intracranial and scalp EEG working memory dataset
    access: open
    citation: "OpenNeuro ds004752"
    urls:
      - https://github.com/OpenNeuroDatasets/ds004752.git
      - https://openneuro.org/datasets/ds004752
    notes: "primary simultaneous iEEG + scalp EEG target for initial validation"
  - source_id: zuna
    kind: model
    title: ZUNA EEG foundation model
    access: open
    citation: "Warner et al. 2026 / Zyphra"
    urls:
      - https://github.com/Zyphra/zuna
      - https://huggingface.co/Zyphra/ZUNA
      - https://pypi.org/project/zuna/
    notes: "benchmark baseline for channel reconstruction and denoising claims"
  - source_id: localize_mi
    kind: dataset
    title: Localize-MI simultaneous HD-EEG and sEEG stimulation benchmark
    access: open
    citation: "Mikulan et al. 2020"
    urls:
      - https://www.nature.com/articles/s41597-020-0467-x
      - https://doi.org/10.12751/g-node.1cc1ae
      - https://gin.g-node.org/ezemikulan/Localize-MI
    notes: "open GIN archive with subject MRIs, surfaces, and forward models for stimulation-based forward/inverse validation"
  - source_id: piastra_2024
    kind: dataset
    title: Piastra 2024 stereotactic EEG volume-conduction validation dataset
    access: open
    citation: "Piastra et al. 2024"
    urls:
      - https://doi.org/10.34973/j0jh-9j28
      - https://data.ru.nl/collections/di/dcmn/DSC_4020000.14_413
    notes: "open Donders/WebDAV dataset for empirical FEM validation against in-vivo sEEG measurements; likely includes anatomy/head-model assets"
  - source_id: zurich_gin_wm
    kind: dataset
    title: Zurich verbal working-memory scalp EEG plus iEEG GIN archive
    access: open
    citation: "Boran et al. 2019 G-Node"
    urls:
      - https://doi.org/10.12751/g-node.d76994
      - https://gin.g-node.org/USZ_NCH/Human_MTL_units_scalp_EEG_and_iEEG_verbal_WM
    notes: "full GIN archive for the paired Zurich working-memory dataset with units and iEEG electrode coordinates; richer than the sparse OpenNeuro metadata checkout"
  - source_id: milan_spes
    kind: dataset
    title: Milan SPES simultaneous HD-EEG and sEEG dataset
    access: open
    citation: "Parmigiani et al. 2022"
    urls:
      - https://osf.io/wsgzp/
      - https://doi.org/10.17605/OSF.IO/WSGZP
      - https://doi.org/10.1016/j.brs.2022.04.007
    notes: "public OSF dataset with multipart BIDS archive and small additional metadata file"
  - source_id: geneva_hidden_ieds
    kind: dataset
    title: Geneva hidden IEDs simultaneous HD-EEG and sEEG dataset
    access: open
    citation: "Zauli et al. 2024"
    urls:
      - https://osf.io/89ndr/
      - https://doi.org/10.17605/OSF.IO/89NDR
      - https://doi.org/10.1016/j.jneumeth.2024.110193
    notes: "public OSF project with a downloadable coreg-spikes archive"
